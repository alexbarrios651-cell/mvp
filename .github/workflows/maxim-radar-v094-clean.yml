name: Maxim Radar v0.9.4 Samsung Clean
on:
  workflow_dispatch:
  push:
    branches: [maxim-radar-v094-clean-20261014]
    paths:
      - tools/apply_clean_v094.py
      - tests/CleanV094Tests.java
      - .github/workflows/maxim-radar-v094-clean.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct stable source from validated base
        run: |
          base64 -d maxim-radar-v092-src.tar.xz.b64 | tar -xJf -
          python3 tools/apply_samsung_v093.py
          python3 tools/apply_clean_v094.py
          grep -q "versionCode 14" app/build.gradle
          grep -q "android:icon" app/src/main/AndroidManifest.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/main/java/com/radarlocal/maxim/core/RealOfferModel.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core and new regression tests
        run: |
          bash tests/run.sh
          mkdir -p /tmp/maxim-v094-tests
          javac -d /tmp/maxim-v094-tests app/src/main/java/com/radarlocal/maxim/core/*.java tests/CleanV094Tests.java
          java -cp /tmp/maxim-v094-tests CleanV094Tests
      - name: Build actual Android APK
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Rename installable without changing prior versions
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Maxim-Radar-LIVE-v0.9.4-Samsung-Clean.apk
          sha256sum release/Maxim-Radar-LIVE-v0.9.4-Samsung-Clean.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Maxim-Radar-LIVE-v0.9.4-Samsung-Clean
          path: release/
          if-no-files-found: error
      - name: Source archive for future development
        run: |
          tar -czf release/Maxim-Radar-LIVE-v0.9.4-Source.tar.gz app tests README.md build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        with:
          name: Maxim-Radar-LIVE-v0.9.4-Source
          path: release/Maxim-Radar-LIVE-v0.9.4-Source.tar.gz
          if-no-files-found: error
