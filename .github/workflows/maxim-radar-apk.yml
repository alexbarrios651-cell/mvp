name: Compilar Maxim Radar APK
on:
  workflow_dispatch:
  push:
    branches: [maxim-radar-apk-20261013]
    paths:
      - maxim-radar-src.tar.xz.b64
      - .github/workflows/maxim-radar-apk.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto Android
        run: |
          test -s maxim-radar-src.tar.xz.b64
          base64 -d maxim-radar-src.tar.xz.b64 | tar -xJf - -C .
          test -f app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Maxim-Radar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
