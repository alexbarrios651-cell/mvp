name: Compilar Maxim Radar Samsung v0.9.2
on:
  workflow_dispatch:
  push:
    branches: [maxim-radar-apk-20261013]
    paths:
      - maxim-radar-v092-src.tar.xz.b64
      - .github/workflows/maxim-radar-apk.yml
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Android v0.9.2
        run: |
          test -s maxim-radar-v092-src.tar.xz.b64
          base64 -d maxim-radar-v092-src.tar.xz.b64 | tar -xJf - -C .
          test -f app/build.gradle
          grep -q "versionCode 12" app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pruebas de parser y cálculo
        run: bash tests/run.sh
      - name: Compilar APK Samsung Beta
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Maxim-Radar-LIVE-v092-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
